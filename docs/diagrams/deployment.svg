<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">BrewLite - Sơ đồ triển khai môi trường Production (Task 3.2)</title>
  <desc id="desc">Sơ đồ triển khai hệ thống BrewLite bao gồm CI/CD runner, Container Registry lưu trữ Docker Image, dịch vụ Web Next.js, API NestJS container, PostgreSQL bền vững và cổng thanh toán.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; }
      .sublabel { font-size: 14px; font-weight: 600; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .service { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .ci { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; rx: 10; }
      .registry { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
      .db { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .cloud { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .edge { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .legend-title { font-size: 15px; font-weight: 700; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="title">BrewLite — Sơ đồ triển khai môi trường Production (Task 3.2)</text>

  <!-- HÀNG 1: CI RUNNER & CONTAINER REGISTRY -->
  <rect x="50" y="70" width="240" height="135" class="ci"/>
  <text x="170" y="102" text-anchor="middle" class="label">GitHub Actions Runner</text>
  <text x="170" y="128" text-anchor="middle" class="sublabel">CI/CD Pipeline</text>
  <text x="170" y="152" text-anchor="middle" class="small">Lint → Test → Build</text>
  <text x="170" y="174" text-anchor="middle" class="small">Đóng gói Docker Image</text>

  <rect x="420" y="70" width="290" height="135" class="registry"/>
  <text x="565" y="102" text-anchor="middle" class="label">Container Registry</text>
  <text x="565" y="128" text-anchor="middle" class="sublabel">GHCR / Docker Hub</text>
  <text x="565" y="152" text-anchor="middle" class="small">Artifact: brewlite-api image</text>
  <text x="565" y="174" text-anchor="middle" class="small">Tag bất biến: commit SHA / v1.0.0</text>

  <!-- Mũi tên từ CI sang Registry -->
  <path d="M290 137 H420" class="edge"/>
  <text x="355" y="125" text-anchor="middle" class="small">Docker Push</text>

  <!-- Mũi tên từ Registry xuống API Service -->
  <path d="M710 137 H805 V260" class="edge dashed"/>
  <text x="765" y="195" text-anchor="middle" class="small">Docker Pull (Deploy)</text>

  <!-- HÀNG 2: RUNTIME SERVICES -->
  <!-- Khách hàng PWA -->
  <rect x="50" y="260" width="190" height="135" class="box"/>
  <text x="145" y="295" text-anchor="middle" class="label">Thiết bị người dùng</text>
  <text x="145" y="325" text-anchor="middle" class="small">Trình duyệt / PWA</text>
  <text x="145" y="350" text-anchor="middle" class="small">Mobile-first</text>
  <text x="145" y="375" text-anchor="middle" class="small">HTTPS công khai</text>

  <!-- Web Next.js -->
  <rect x="320" y="260" width="250" height="135" class="service"/>
  <text x="445" y="295" text-anchor="middle" class="label">Dịch vụ Web / CDN</text>
  <text x="445" y="325" text-anchor="middle" class="small">Giao diện Next.js (apps/web)</text>
  <text x="445" y="350" text-anchor="middle" class="small">Tài nguyên tĩnh + SSR</text>
  <text x="445" y="375" text-anchor="middle" class="small">Không chứa secret Database</text>

  <!-- API NestJS -->
  <rect x="680" y="260" width="250" height="135" class="service"/>
  <text x="805" y="295" text-anchor="middle" class="label">Dịch vụ API</text>
  <text x="805" y="325" text-anchor="middle" class="small">Container NestJS (:8080)</text>
  <text x="805" y="350" text-anchor="middle" class="small">Modular Monolith (apps/api)</text>
  <text x="805" y="375" text-anchor="middle" class="small">Kiểm tra sức khỏe: GET /health</text>

  <!-- Cổng thanh toán -->
  <path d="M1020 260 C1095 220 1170 260 1150 320 C1170 375 1080 410 1020 370 C970 360 965 280 1020 260 Z" class="cloud"/>
  <text x="1065" y="305" text-anchor="middle" class="label">Cổng thanh toán</text>
  <text x="1065" y="333" text-anchor="middle" class="small">Mô phỏng Ví / Thẻ</text>
  <text x="1065" y="358" text-anchor="middle" class="small">HTTPS (Idempotent)</text>

  <!-- Mũi tên Client -> Web -> API -> Payment -->
  <path d="M240 327 H320" class="edge"/>
  <text x="280" y="315" text-anchor="middle" class="small">HTTPS</text>

  <path d="M570 327 H680" class="edge"/>
  <text x="625" y="315" text-anchor="middle" class="small">REST + CORS</text>

  <path d="M930 327 H980" class="edge"/>
  <text x="965" y="315" text-anchor="middle" class="small">HTTPS</text>

  <!-- HÀNG 3: DATABASE POSTGRESQL -->
  <rect x="680" y="455" width="250" height="130" class="db"/>
  <text x="805" y="490" text-anchor="middle" class="label">PostgreSQL Database</text>
  <text x="805" y="520" text-anchor="middle" class="small">Persistent Storage (Volume)</text>
  <text x="805" y="545" text-anchor="middle" class="small">Mạng nội bộ (Private) :5432</text>
  <text x="805" y="570" text-anchor="middle" class="small">Prisma Migration + Tự sao lưu</text>

  <!-- Mũi tên API -> DB -->
  <path d="M805 395 V455" class="edge"/>
  <text x="880" y="430" text-anchor="middle" class="small">TLS / Private Network</text>

  <!-- HÀNG 4: BẢNG PHÂN TÁCH RANH GIỚI MÔI TRƯỜNG -->
  <rect x="50" y="625" width="1100" height="150" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="10"/>
  <text x="75" y="655" class="legend-title">Phân tách ranh giới các môi trường (Environment Boundaries)</text>

  <text x="75" y="685" class="sublabel">• Local Development:</text>
  <text x="240" y="685" class="small">Môi trường máy cá nhân lập trình viên, khởi chạy Docker Compose cục bộ, .env độc lập không commit Git.</text>

  <text x="75" y="715" class="sublabel">• CI &amp; Container Registry:</text>
  <text x="240" y="715" class="small">GitHub Actions tự động chạy Quality Gate (Lint, Test, Build), đóng gói Docker Image gắn tag commit SHA và lưu trữ trên Registry.</text>

  <text x="75" y="745" class="sublabel">• Cloud Production:</text>
  <text x="240" y="745" class="small">Kéo Image chính thức từ Registry, HTTPS công khai, DB nằm trong mạng riêng tư, secret lưu ở Secret Store, hỗ trợ rollback tức thì.</text>
</svg>
