name: CD Pipeline (Continuous Delivery & Deployment)

# ==============================================================================
# BREWLITE CD WORKFLOW - TASK 5.3 CONTINUOUS DELIVERY / DEPLOYMENT
# Luồng chuẩn: Push/Tag -> Lint & Test -> Build -> Docker Image/Deploy -> Smoke Test
# ==============================================================================

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # GIAI ĐOẠN 1: QUALITY GATE (LINT & TEST)
  # ============================================================================
  quality-gate:
    name: 1. Quality Gate (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite?schema=public
      JWT_SECRET: cd-pipeline-secure-test-jwt-secret-key-32chars

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Cài đặt dependencies Backend
        working-directory: apps/api
        run: npm ci

      - name: Sinh Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Chạy Static Code Analysis (Backend Linter)
        working-directory: apps/api
        run: npm run lint

      - name: Chạy toàn bộ Unit & Integration Tests (Backend)
        working-directory: apps/api
        run: npm test

      - name: Cài đặt dependencies Frontend
        working-directory: apps/web
        run: npm ci

      - name: Chạy Static Code Analysis (Frontend Linter)
        working-directory: apps/web
        run: npm run lint

  # ============================================================================
  # GIAI ĐOẠN 2: BUILD ỨNG DỤNG (FRONTEND & BACKEND)
  # ============================================================================
  build:
    name: 2. Build Artifacts
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Backend NestJS
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL || 'http://localhost:8080' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build || npm run build

  # ============================================================================
  # GIAI ĐOẠN 3: DOCKER IMAGE BUILD & DEPLOY TO PRODUCTION
  # ============================================================================
  package-and-deploy:
    name: 3. Docker Image & Cloud Deployment
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đóng gói Docker Image Backend (Tag commit SHA & latest)
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag ghcr.io/${{ github.repository }}/brewlite-api:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}/brewlite-api:latest \
            apps/api

      - name: Đóng gói Docker Image Frontend (Tag commit SHA & latest)
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL || 'https://api-brewlite.onrender.com' }} \
            --tag ghcr.io/${{ github.repository }}/brewlite-web:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}/brewlite-web:latest \
            apps/web

      - name: Kích hoạt triển khai Backend API lên Cloud PaaS
        run: |
          if [ -n "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}" ]; then
            echo "🚀 Đang kích hoạt webhook triển khai Backend API..."
            curl -f -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}"
            echo "✅ Kích hoạt triển khai Backend API thành công."
          else
            echo "::warning::Chưa cấu hình secret BACKEND_DEPLOY_WEBHOOK. Bỏ qua bước webhook deploy."
          fi

      - name: Kích hoạt triển khai Frontend Web lên Cloud PaaS
        run: |
          if [ -n "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}" ]; then
            echo "🚀 Đang kích hoạt webhook triển khai Frontend Web..."
            curl -f -X POST "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}"
            echo "✅ Kích hoạt triển khai Frontend Web thành công."
          else
            echo "::warning::Chưa cấu hình secret FRONTEND_DEPLOY_WEBHOOK. Bỏ qua bước webhook deploy."
          fi

  # ============================================================================
  # GIAI ĐOẠN 4: SMOKE TEST (KIỂM THỬ KHÓI XÁC NHẬN PRODUCTION)
  # ============================================================================
  smoke-test:
    name: 4. Post-Deployment Smoke Test
    needs: package-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Chờ môi trường Cloud khởi động và sẵn sàng
        run: |
          echo "⏳ Chờ 15 giây để phiên bản mới trên Cloud hoàn tất khởi động..."
          sleep 15

      - name: Thực hiện kiểm thử khói (Smoke Test Endpoint)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          TARGET_URL="${PROD_API_URL:-https://api-brewlite.onrender.com}"
          echo "🔍 Đang thực hiện Smoke Test tới máy chủ: $TARGET_URL"
          
          if [ -z "${{ secrets.PROD_API_URL }}" ]; then
            echo "::notice::Chưa cấu hình secret PROD_API_URL. Chạy kiểm tra mô phỏng qua runner độc lập."
            node tests/e2e-checkout.flow.mjs "$TARGET_URL" || echo "⚠️ Máy chủ $TARGET_URL chưa sẵn sàng hoặc đang ở chế độ cold start. Bỏ qua chặn lỗi nếu chưa có live URL."
          else
            echo "Kiểm tra endpoint Health..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health" || curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/")
            echo "HTTP Status nhận được: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Health check thành công! Ứng dụng đã sẵn sàng phục vụ."
            else
              echo "❌ Health check trả về mã lỗi: $HTTP_STATUS"
              exit 1
            fi
          fi
