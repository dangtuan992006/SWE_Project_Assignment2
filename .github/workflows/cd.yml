name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloud PaaS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Backend API Deployment
        run: curl -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}"

      - name: Trigger Frontend Web Deployment
        run: curl -X POST "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}"
