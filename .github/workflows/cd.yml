name: CD Pipeline (Continuous Delivery & Deployment)

# ==============================================================================
# BREWLITE CD WORKFLOW - TASK 5.3 CONTINUOUS DELIVERY / DEPLOYMENT
# Luồng chuẩn: Push/Tag -> Lint & Test -> Build -> Docker Image/Deploy -> Smoke Test
# ==============================================================================

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # GIAI ĐOẠN 1: QUALITY GATE (LINT & TEST)
  # ============================================================================
  quality-gate:
    name: 1. Quality Gate (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite?schema=public
      JWT_SECRET: cd-pipeline-secure-test-jwt-secret-key-32chars

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Cài đặt dependencies Backend
        working-directory: apps/api
        run: npm ci

      - name: Sinh Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Chạy Static Code Analysis (Backend Linter)
        working-directory: apps/api
        run: npm run lint

      - name: Chạy toàn bộ Unit & Integration Tests (Backend)
        working-directory: apps/api
        run: npm test

      - name: Cài đặt dependencies Frontend
        working-directory: apps/web
        run: npm ci

      - name: Chạy Static Code Analysis (Frontend Linter)
        working-directory: apps/web
        run: npm run lint

      - name: Chạy Unit Tests Frontend (VNPay)
        working-directory: apps/web
        run: npm run test:vnpay

  # ============================================================================
  # GIAI ĐOẠN 2: BUILD ỨNG DỤNG (FRONTEND & BACKEND)
  # ============================================================================
  build:
    name: 2. Build Artifacts
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Backend NestJS
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL || 'http://localhost:8080' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build

  # ============================================================================
  # GIAI ĐOẠN 3: DOCKER IMAGE BUILD & DEPLOY TO PRODUCTION
  # ============================================================================
  package-and-deploy:
    name: 3. Docker Image & Cloud Deployment
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Đóng gói & đẩy Docker Image Backend lên GHCR (SHA, latest, tag)
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS=(
            "--tag" "ghcr.io/${IMAGE_REPO}/brewlite-api:${{ github.sha }}"
            "--tag" "ghcr.io/${IMAGE_REPO}/brewlite-api:latest"
          )
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS+=("--tag" "ghcr.io/${IMAGE_REPO}/brewlite-api:${{ github.ref_name }}")
          fi
          docker buildx build \
            --file apps/api/Dockerfile \
            "${TAGS[@]}" \
            --push \
            apps/api

      - name: Đóng gói & đẩy Docker Image Frontend lên GHCR (SHA, latest, tag)
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS=(
            "--tag" "ghcr.io/${IMAGE_REPO}/brewlite-web:${{ github.sha }}"
            "--tag" "ghcr.io/${IMAGE_REPO}/brewlite-web:latest"
          )
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS+=("--tag" "ghcr.io/${IMAGE_REPO}/brewlite-web:${{ github.ref_name }}")
          fi
          docker buildx build \
            --file apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL || 'https://brewlite-api-2tuk.onrender.com' }}" \
            "${TAGS[@]}" \
            --push \
            apps/web

      - name: Kích hoạt triển khai Backend API lên Cloud PaaS
        run: |
          if [ -n "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}" ]; then
            echo "🚀 Đang kích hoạt webhook triển khai Backend API..."
            curl -f -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK }}"
            echo "✅ Kích hoạt triển khai Backend API thành công."
          else
            echo "::warning::Chưa cấu hình secret BACKEND_DEPLOY_WEBHOOK. Bỏ qua bước webhook deploy."
          fi

      - name: Kích hoạt triển khai Frontend Web lên Cloud PaaS
        run: |
          if [ -n "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}" ]; then
            echo "🚀 Đang kích hoạt webhook triển khai Frontend Web..."
            curl -f -X POST "${{ secrets.FRONTEND_DEPLOY_WEBHOOK }}"
            echo "✅ Kích hoạt triển khai Frontend Web thành công."
          else
            echo "::warning::Chưa cấu hình secret FRONTEND_DEPLOY_WEBHOOK. Bỏ qua bước webhook deploy."
          fi

  # ============================================================================
  # GIAI ĐOẠN 4: SMOKE TEST (KIỂM THỬ KHÓI XÁC NHẬN PRODUCTION)
  # ============================================================================
  smoke-test:
    name: 4. Post-Deployment Smoke Test
    needs: package-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Chờ môi trường Cloud khởi động và sẵn sàng
        run: |
          echo "⏳ Chờ 15 giây để phiên bản mới trên Cloud hoàn tất khởi động..."
          sleep 15

      - name: Thực hiện kiểm thử khói (Smoke Test Endpoint)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_WEB_URL: ${{ secrets.PROD_WEB_URL }}
        run: |
          TARGET_URL="${PROD_API_URL:-https://brewlite-api-2tuk.onrender.com}"
          TARGET_URL="${TARGET_URL%/}"
          WEB_URL="${PROD_WEB_URL:-https://swe-project-assignment2.vercel.app}"
          WEB_URL="${WEB_URL%/}"

          check_http_200() {
            local url="$1"
            local label="$2"
            local max_attempts=12
            local sleep_seconds=5
            local status="000"

            for attempt in $(seq 1 "$max_attempts"); do
              status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              if [ "$status" = "200" ]; then
                echo "✅ $label trả về HTTP 200 ($url, attempt $attempt/$max_attempts)"
                return 0
              fi
              echo "⏳ $label chưa sẵn sàng (HTTP $status, attempt $attempt/$max_attempts)..."
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$sleep_seconds"
              fi
            done

            echo "❌ $label thất bại sau $max_attempts lần thử (HTTP $status): $url"
            return 1
          }

          echo "🔍 Đang thực hiện Smoke Test tới API: $TARGET_URL | Web: $WEB_URL"
          check_http_200 "${TARGET_URL}/health" "API Health"
          check_http_200 "${TARGET_URL}/swagger" "API Swagger"
          check_http_200 "${WEB_URL}" "Frontend Web"
          node tests/e2e-checkout.flow.mjs --smoke "$TARGET_URL"
